<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Petición 4</title>
    <style>
        body {
            background-color: #ffe6f2; /* Fondo rosado pastel */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contenedor {
            background-color: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.2); /* Sombra rosada */
            border-top: 6px solid #ff66b2; /* Borde superior fucsia */
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #d63384; /* Fucsia oscuro para el título */
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: #fff0f5; /* Rosado muy clarito para cada ítem */
            margin: 12px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #ff99cc; /* Detalle lateral rosado */
            font-size: 16px;
        }
        strong {
            color: #c2185b; /* Color vino/fucsia para resaltar */
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Punto 4: Consultas anyMatch y noneMatch</h1>

    <ul>
        <li><strong>¿Hay algún peligro crítico (> 90)? (anyMatch):</strong> <span th:text="${critico}"></span></li>
        <li><strong>¿Hay algún ataque tipo Troyano? (anyMatch):</strong> <span th:text="${troyano}"></span></li>
        <li><strong>¿No hay ninguna amenaza de nivel muy bajo (< 10)? (noneMatch):</strong> <span th:text="${sinBajas}"></span></li>
    </ul>
</div>

</body>
</html>
