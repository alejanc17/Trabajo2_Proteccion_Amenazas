<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Petición 2</title>
    <style>
        body { background-color: #ffe6f2; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .contenedor { background-color: white; padding: 30px 40px; border-radius: 12px; box-shadow: 0 8px 20px rgba(255, 105, 180, 0.2); border-top: 6px solid #ff66b2; max-width: 600px; width: 100%; }
        h1 { color: #d63384; text-align: center; margin-bottom: 25px; font-size: 28px; }
        ul { list-style-type: none; padding: 0; }
        li { background-color: #fff0f5; margin: 12px 0; padding: 15px; border-radius: 8px; border-left: 5px solid #ff99cc; font-size: 16px; }
        strong { color: #c2185b; }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>Punto 2: Estadísticas del Nivel de Peligro</h1>
    <ul>
        <li><strong>Conteo (Cantidad de amenazas):</strong> <span th:text="${conteo}"></span></li>
        <li><strong>Suma Total:</strong> <span th:text="${suma}"></span></li>
        <li><strong>Promedio:</strong> <span th:text="${promedio}"></span></li>
        <li><strong>Mínimo:</strong> <span th:text="${minimo}"></span></li>
        <li><strong>Máximo:</strong> <span th:text="${maximo}"></span></li>
    </ul>
</div>
</body>
</html>
